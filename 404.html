<style>
:root { --felt:#082f22; --felt-deep:#051f16; --paper:#f2eee3; --brass:#d6b15c; --dim:rgba(242,238,227,.74); --faint:rgba(242,238,227,.58); --line:rgba(242,238,227,.18);
  --display:"Iowan Old Style","Palatino Linotype",Georgia,serif; --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace; --gutter:clamp(1.25rem,0.6rem + 3vw,4rem); }
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body { min-height:100svh; display:flex; flex-direction:column; font-family:var(--display); color:var(--paper); background:var(--felt); -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration:none; }
:focus-visible { outline:2px solid var(--brass); outline-offset:4px; }
.bar { display:flex; justify-content:space-between; align-items:center; min-height:3.75rem; padding-inline:var(--gutter); background:var(--felt-deep); }
.brand { font-style:italic; font-weight:700; font-size:1.15rem; }
.bar .mail { font-family:var(--mono); font-size:.8rem; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
main { flex:1; display:flex; flex-direction:column; justify-content:center; padding:clamp(2rem,6vw,5rem) var(--gutter); }
.eyebrow { font-family:var(--mono); font-size:.8rem; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); }
h1 { margin-top:.6rem; font-style:italic; font-weight:700; font-size:clamp(3.6rem,15vw,11rem); line-height:.9; letter-spacing:-.03em; }
p.lede { margin-top:1.4rem; max-width:36ch; font-size:clamp(1.1rem,1rem + .6vw,1.45rem); color:var(--dim); }
.links { display:flex; flex-wrap:wrap; gap:.75rem 1rem; margin-top:2rem; }
.links a { display:inline-flex; align-items:center; gap:.6rem; min-height:48px; padding:0 1.4rem; border:1px solid var(--paper); border-radius:100px; font-family:var(--mono); font-size:.85rem; letter-spacing:.08em; text-transform:uppercase; }
.links a:first-child { background:var(--paper); color:var(--felt-deep); }
.links .dot { width:7px; height:7px; border-radius:50%; background:var(--brass); }
footer { padding:1.4rem var(--gutter); border-top:1px solid var(--line); font-family:var(--mono); font-size:.8rem; letter-spacing:.08em; color:var(--faint); }
@media (max-width:640px) { .links a { width:100%; justify-content:center; } }
</style>
</head>
<body>
<header class="bar"><a class="brand" href="/">Joe Curry</a><a class="mail" href="mailto:jjcurry027@gmail.com">Email</a></header>
<main>
  <p class="eyebrow">404 · jcurry44.github.io</p>
  <h1>Not found.</h1>
  <p class="lede">There is no page at this address. The work, the studio and the way to reach me are on the front page.</p>
  <nav class="links" aria-label="Where to go">
    <a href="/"><span class="dot"></span>Front page</a>
    <a href="https://jcurry44.github.io/public-ledger/">Public Ledger</a>
    <a href="mailto:jjcurry027@gmail.com">Email Joe</a>
  </nav>
</main>
<footer>© 2026 Joe Curry · Independent product &amp; data studio, Buffalo, NY</footer>
</body>
</html>
